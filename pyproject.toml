[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medimg-research"
version = "0.1.0"
description = "Modular medical imaging research pipelines"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "Pillow>=10.0",
]

[project.optional-dependencies]
train = [
    "torch>=2.2",
    "torchvision>=0.17",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
medimg = "medimg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
